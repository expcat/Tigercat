name: Create Release Tags

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse automatic version bumps
        run: |
          echo "Tags are created by a person on the default branch." >&2
          echo "This workflow does not bump a patch from commit count or push a tag." >&2
          exit 1
