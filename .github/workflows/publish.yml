name: Publish to NPM

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse branch publish
        run: |
          echo "Package publish only runs from a vX.Y.Z tag on the default branch (publish-on-tag.yml)." >&2
          echo "This workflow does not publish from a branch or an arbitrary tag string." >&2
          exit 1
